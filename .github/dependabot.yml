# Dependabot の設定（依存の更新 PR を週 1 回出す）
# 技術スタックは TypeScript / Node（npm）。更新の間隔と、minor / patch をまとめる書き方は、
# github-actions と同じにしている。
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"
